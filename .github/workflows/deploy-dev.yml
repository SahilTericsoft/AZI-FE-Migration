# Continuous deploy: every push to `dev` builds the image and redeploys
# the persistent `azi-fe-dev` Cloud Run service. No PR gating, no teardown.
#
# Auth is keyless (Workload Identity Federation) — no GitHub secrets needed.

name: Deploy dev

on:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token exchanged for GCP credentials

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  PROJECT_ID: project-e1402356-002b-471c-a6a
  REGION: asia-south1
  SERVICE: azi-fe-dev
  IMAGE: asia-south1-docker.pkg.dev/project-e1402356-002b-471c-a6a/azi-fe-previews/azi-fe:dev-${{ github.sha }}
  WIF_PROVIDER: projects/559630004965/locations/global/workloadIdentityPools/github-pool/providers/azi-github
  DEPLOYER_SA: azi-fe-deployer@project-e1402356-002b-471c-a6a.iam.gserviceaccount.com
  BACKEND_ORIGIN: https://azi-backend-dev-3hdwczgfnq-el.a.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=azi-fe
          cache-to: type=gha,scope=azi-fe,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 3 \
            --cpu-boost \
            --set-env-vars "BACKEND_ORIGIN=$BACKEND_ORIGIN" \
            --quiet

          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)')

          {
            echo "### Deployed to Cloud Run"
            echo ""
            echo "**Service:** \`$SERVICE\`"
            echo "**URL:** $URL"
            echo "**Commit:** ${GITHUB_SHA:0:7}"
          } >> "$GITHUB_STEP_SUMMARY"
