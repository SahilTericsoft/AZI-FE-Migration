# Destroys the Cloud Run preview environment when a PR to `dev` is
# closed (merged or not). Counterpart of preview-deploy.yml.

name: PR Preview — Destroy

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: project-e1402356-002b-471c-a6a
  REGION: asia-south1
  SERVICE: azi-fe-pr-${{ github.event.number }}
  IMAGE: asia-south1-docker.pkg.dev/project-e1402356-002b-471c-a6a/azi-fe-previews/azi-fe:pr-${{ github.event.number }}
  WIF_PROVIDER: projects/559630004965/locations/global/workloadIdentityPools/github-pool/providers/azi-github
  DEPLOYER_SA: azi-fe-deployer@project-e1402356-002b-471c-a6a.iam.gserviceaccount.com

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Delete Cloud Run service
        run: |
          gcloud run services delete "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet || echo "Service $SERVICE not found — nothing to delete."

      - name: Delete preview image
        run: |
          gcloud artifacts docker images delete "$IMAGE" \
            --delete-tags --quiet || echo "Image not found — nothing to delete."

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🧹 Preview environment \`${process.env.SERVICE}\` has been destroyed.`,
            });
