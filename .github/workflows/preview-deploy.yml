# PR preview environments on Cloud Run.
#
# Every PR targeting `dev` gets its own Cloud Run service
# (azi-fe-pr-<PR number>) and the temporary URL is posted as a PR comment.
# The service is destroyed by preview-cleanup.yml when the PR is closed.
#
# Auth is keyless (Workload Identity Federation) — no GitHub secrets needed.
# The identifiers below are not sensitive.

name: PR Preview — Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token exchanged for GCP credentials
  pull-requests: write # post the preview-URL comment

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: project-e1402356-002b-471c-a6a
  REGION: asia-south1
  SERVICE: azi-fe-pr-${{ github.event.number }}
  IMAGE: asia-south1-docker.pkg.dev/project-e1402356-002b-471c-a6a/azi-fe-previews/azi-fe:pr-${{ github.event.number }}
  WIF_PROVIDER: projects/559630004965/locations/global/workloadIdentityPools/github-pool/providers/azi-github
  DEPLOYER_SA: azi-fe-deployer@project-e1402356-002b-471c-a6a.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=azi-fe
          cache-to: type=gha,scope=azi-fe,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --labels "preview=true,pr=${{ github.event.number }}" \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cloud-run-preview -->';
            const body = [
              marker,
              '### 🚀 Preview deployed',
              '',
              `| Service | URL |`,
              `| --- | --- |`,
              `| \`${process.env.SERVICE}\` | ${{ toJSON(steps.deploy.outputs.url) }} |`,
              '',
              `Updated for commit ${context.payload.pull_request.head.sha.slice(0, 7)}. ` +
              'This environment is destroyed automatically when the PR is closed.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
